# Stockster API Configuration
# Database settings for development and production environments

development:
  database:
    type: sqlite
    path: ../db/stocks_db.db
    timeout: 10.0

production:
  database:
    type: postgresql
    host: ${POSTGRES_HOST:postgres-service}
    port: ${POSTGRES_PORT:5432}
    database: ${POSTGRES_DB:stockster}
    user: ${POSTGRES_USER:stockster}
    password: ${POSTGRES_PASSWORD}
    connect_timeout: 10

# Default environment (can be overridden by ENVIRONMENT env var)
default_environment: development
