name: CD - Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (e.g., main-a3f2b1c or leave empty for latest)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Determine image tag
        id: image-tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=main-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
      
      - name: Update deployment manifests
        run: |
          NAMESPACE="stockster-${{ inputs.environment }}"
          IMAGE_TAG="${{ steps.image-tag.outputs.tag }}"
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          
          echo "Deploying to namespace: $NAMESPACE"
          echo "Using image tag: $IMAGE_TAG"
          
          # Update kustomization with new tag
          sed -i "s|newTag:.*|newTag: $IMAGE_TAG|g" k8s/kustomization.yaml
          
          # Apply manifests
          kubectl apply -k k8s/ --namespace=$NAMESPACE
      
      - name: Wait for rollout
        run: |
          NAMESPACE="stockster-${{ inputs.environment }}"
          
          echo "Waiting for dashboard deployment to roll out..."
          kubectl rollout status deployment/stockster-dashboard -n $NAMESPACE --timeout=5m
          
          echo "✓ Deployment successful!"
      
      - name: Verify deployment
        run: |
          NAMESPACE="stockster-${{ inputs.environment }}"
          
          echo "Current deployment status:"
          kubectl get deployments -n $NAMESPACE
          kubectl get cronjobs -n $NAMESPACE
          
          echo ""
          echo "Current image versions:"
          kubectl get deployment stockster-dashboard -n $NAMESPACE \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          kubectl get cronjob stockster-scraper -n $NAMESPACE \
            -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}'
          echo ""
      
      - name: Run smoke tests
        run: |
          NAMESPACE="stockster-${{ inputs.environment }}"
          
          echo "Running basic health checks..."
          # Add your smoke tests here
          kubectl get pods -n $NAMESPACE -l app=stockster-dashboard
          
          echo "✓ Smoke tests passed!"
        continue-on-error: true
      
      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ENV="${{ inputs.environment }}"
          TAG="${{ steps.image-tag.outputs.tag }}"
          
          echo "Deployment $STATUS for $ENV environment with tag $TAG"
          # Add Slack/Discord/Email notification here if needed

env:
  REGISTRY: ghcr.io
