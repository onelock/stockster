apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # 1. Allow Postgres time to save data on shutdown
      terminationGracePeriodSeconds: 120

      # 2. Fix volume permission issues
      securityContext:
        fsGroup: 999 # Standard Postgres UID
        runAsUser: 999
        runAsNonRoot: true

      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        
        envFrom:
        - configMapRef: 
          name: postgres-db-config 
        - secretRef:
            name: postgres-secret
          
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        
        resources:
          requests:
            memory: "1Gi" # Giving it a guaranteed 1GB
            cpu: "500m"   # Guaranteed half a core
          limits:
            memory: "2Gi" # Cap it at 2GB
            cpu: "1000m"  # Cap at 1 full core
        
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
  
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
