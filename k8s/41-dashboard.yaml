apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockster-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5  # Keep last 5 revisions for rollback
  selector:
    matchLabels:
      app: stockster-dashboard
  template:
    metadata:
      labels:
        app: stockster-dashboard
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      
      containers:
      - name: dashboard
        image: stockster/dashboard
        imagePullPolicy: Always
        
        ports:
        - containerPort: 8501
          name: http
        
        env:
        - name: API_URL
          value: "http://stockster-api"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: stockster-dashboard
spec:
  type: LoadBalancer  # Or ClusterIP with Ingress
  ports:
  - port: 80
    targetPort: 8501
    protocol: TCP
  selector:
    app: stockster-dashboard
