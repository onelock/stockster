apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockster-api
  namespace: stockster
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stockster-api
  template:
    metadata:
      labels:
        app: stockster-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      
      containers:
      - name: api
        image: stockster/api
        imagePullPolicy: Always
        
        ports:
        - containerPort: 8000
          name: http
        
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: stockster-api
  namespace: stockster
spec:
  type: LoadBalancer  # Or ClusterIP with Ingress
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: stockster-api
