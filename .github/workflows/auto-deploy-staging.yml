name: Auto Deploy to Staging

on:
  push:
    branches:
      - main

# Prevent concurrent deployments to staging
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: stockster

jobs:
  # =============================================================================
  # PHASE 1: Detect Changes & Plan Deployment
  # =============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      dashboard_changed: ${{ steps.filter.outputs.dashboard }}
      api_changed: ${{ steps.filter.outputs.app }}
      scraper_changed: ${{ steps.filter.outputs.scraper }}
      manifests_changed: ${{ steps.filter.outputs.k8s }}
      image_tag: ${{ steps.meta.outputs.tag }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate image tag
        id: meta
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
              - 'docker/Dockerfile.dashboard'
              - 'dashboard/requirements-dsh.txt'
            app:
              - 'app/**'
              - 'docker/Dockerfile.api'
              - 'app/requirements-trdeng.txt'
            scraper:
              - 'di_scraper/**'
              - 'docker/Dockerfile.scraper'
              - 'di_scraper/requirements-scraper.txt'
            k8s:
              - 'k8s/**'
  
  create-deployment-plan:
    name: Create Deployment Plan
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      deploy_api: ${{ needs.detect-changes.outputs.api_changed == 'true' }}
      deploy_dashboard: ${{ needs.detect-changes.outputs.dashboard_changed == 'true' }}
      deploy_scraper: ${{ needs.detect-changes.outputs.scraper_changed == 'true' }}
      deploy_k8s: ${{ needs.detect-changes.outputs.manifests_changed == 'true' }}
      anything_to_deploy: ${{ steps.check.outputs.deploy_needed }}
    
    steps:
      - name: Determine deployment plan
        id: check
        run: |
          DEPLOY_NEEDED="false"
          if [ "${{ needs.detect-changes.outputs.api_changed }}" == "true" ] || \
             [ "${{ needs.detect-changes.outputs.dashboard_changed }}" == "true" ] || \
             [ "${{ needs.detect-changes.outputs.manifests_changed }}" == "true" ] || \
             [ "${{ needs.detect-changes.outputs.scraper_changed }}" == "true" ]; then
            DEPLOY_NEEDED="true"
          fi
          echo "deploy_needed=$DEPLOY_NEEDED" >> $GITHUB_OUTPUT
      
      - name: Print deployment plan
        run: |
          echo "## 📋 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag**: \`${{ needs.detect-changes.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Components" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ needs.detect-changes.outputs.api_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard**: ${{ needs.detect-changes.outputs.dashboard_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **K8s Manifests**: ${{ needs.detect-changes.outputs.manifests_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.deploy_needed }}" == "true" ]; then
            echo "**Decision**: ✅ Deployment will proceed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Decision**: ⏭️ No deployment needed" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # PHASE 2: Build Images (Parallel, Conditional)
  # =============================================================================
  build-dashboard:
    name: Build Dashboard
    needs: [detect-changes, create-deployment-plan]
    if: needs.create-deployment-plan.outputs.deploy_dashboard == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      component: dashboard
      dockerfile: docker/Dockerfile.dashboard
      image_name: stockster-dashboard
      image_tag: ${{ needs.detect-changes.outputs.image_tag }}
      registry: ghcr.io
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
  
  build-api:
    name: Build API
    needs: [detect-changes, create-deployment-plan]
    if: needs.create-deployment-plan.outputs.deploy_api == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      component: api
      dockerfile: docker/Dockerfile.api
      image_name: stockster-api
      image_tag: ${{ needs.detect-changes.outputs.image_tag }}
      registry: ghcr.io
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
  
  build-scraper:
    name: Build Scraper
    needs: [detect-changes, create-deployment-plan]
    if: needs.create-deployment-plan.outputs.deploy_scraper == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      component: scraper
      dockerfile: docker/Dockerfile.scraper
      image_name: stockster-scraper
      image_tag: ${{ needs.detect-changes.outputs.image_tag }}
      registry: ghcr.io
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # PHASE 3: Deploy to Kubernetes (Gated by Build Success)
  # =============================================================================
  deploy:
    name: Deploy to Staging
    needs: [detect-changes, create-deployment-plan, build-dashboard, build-api, build-scraper]
    if: |
      always() &&
      needs.create-deployment-plan.outputs.anything_to_deploy == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/_deploy-k8s.yml
    with:
      environment: staging
      namespace: stockster
      image_tag: ${{ needs.detect-changes.outputs.image_tag }}
      dashboard_changed: ${{ needs.detect-changes.outputs.dashboard_changed == 'true' }}
      api_changed: ${{ needs.detect-changes.outputs.api_changed == 'true' }}
      registry: ghcr.io
    secrets:
      kube_config: ${{ secrets.KUBE_CONFIG }}
      postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
