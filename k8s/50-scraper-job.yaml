apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockster-scraper
  namespace: stockster
spec:
  # Every 15 minutes during market hours (9:00-17:30 CET = 8:00-16:30 UTC, Mon-Fri)
  # schedule: "*/15 8-16 * * 1-5" # winter time
  # Note: During summertime, market hours are 9:00-17:30 CEST = 7:00-15:30 UTC
  schedule: "*/15 7-15 * * 1-5" # summertime
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  
  jobTemplate:
    spec:
      backoffLimit: 0  # Retry twice on failure
      activeDeadlineSeconds: 600  # 10 minute timeout (much faster without installations)
      template:
        metadata:
          labels:
            app: stockster-scraper
        spec:
          restartPolicy: Never  # Retry failed containers
          
          imagePullSecrets:
          - name: ghcr-secret
          
          containers:
          - name: scraper
            image: stockster/scraper
            imagePullPolicy: Always
            
            command: ["python", "/app/scrape_di.py"]
            
            volumeMounts:
            - name: stockster-data
              mountPath: /data
            - name: scraper-code
              mountPath: /app
            
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
          
          volumes:
          - name: stockster-data
            persistentVolumeClaim:
              claimName: stockster-data-pvc
          - name: scraper-code
            configMap:
              name: scraper-code
              defaultMode: 0777
