apiVersion: v1
kind: Service
metadata:
  name: stockster-postgres-svc
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: stockster-postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stockster-postgres
spec:
  serviceName: stockster-postgres
  replicas: 1
  selector:
    matchLabels:
      app: stockster-postgres
  template:
    metadata:
      labels:
        app: stockster-postgres
    spec:
      # 1. Allow Postgres time to save data on shutdown
      terminationGracePeriodSeconds: 120

      # 2. Fix volume permission issues
      securityContext:
        fsGroup: 999 # Standard Postgres UID
        runAsUser: 999
        runAsNonRoot: true

      containers:
      - name: stockster-postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        
        env:
        - name: PG_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-db-config
              key: PG_USER
        - name: PG_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-db-config
              key: PG_DB
        - name: PG_DATA
          valueFrom:
            configMapKeyRef:
              name: postgres-db-config
              key: PG_DATA
              
        # Load sensitive data ONLY from Secret
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
          
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        
        resources:
          requests:
            memory: "1Gi" # Giving it a guaranteed 1GB
            cpu: "500m"   # Guaranteed half a core
          limits:
            memory: "2Gi" # Cap it at 2GB
            cpu: "1000m"  # Cap at 1 full core
        
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - stockster-postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - stockster-postgres
          initialDelaySeconds: 5
          periodSeconds: 5
  
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
