name: Auto Deploy to Staging

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REPO_OWNER_LC: onelock

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Detect changed components
        id: changes
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
              # First push to branch - build all
              echo "build_scraper=true" >> $GITHUB_OUTPUT
              echo "build_dashboard=true" >> $GITHUB_OUTPUT
              echo "build_api=true" >> $GITHUB_OUTPUT
              echo "First push - building all components"
            else
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
              echo "Changed files:"
              echo "$CHANGED_FILES"
              
              # Check if scraper needs rebuild
              if echo "$CHANGED_FILES" | grep -qE '^(di_scraper/|Dockerfile\.scraper|requirements\.txt)'; then
                echo "build_scraper=true" >> $GITHUB_OUTPUT
                echo "Scraper changes detected"
              else
                echo "build_scraper=false" >> $GITHUB_OUTPUT
                echo "No scraper changes"
              fi
              
              # Check if dashboard needs rebuild
              if echo "$CHANGED_FILES" | grep -qE '^(dashboard/|Dockerfile\.dashboard|requirements\.txt)'; then
                echo "build_dashboard=true" >> $GITHUB_OUTPUT
                echo "Dashboard changes detected"
              else
                echo "build_dashboard=false" >> $GITHUB_OUTPUT
                echo "No dashboard changes"
              fi
              
              # Check if API needs rebuild
              if echo "$CHANGED_FILES" | grep -qE '^(api/|Dockerfile\.api|requirements\.txt)'; then
                echo "build_api=true" >> $GITHUB_OUTPUT
                echo "API changes detected"
              else
                echo "build_api=false" >> $GITHUB_OUTPUT
                echo "No API changes"
              fi
              
              # Check if analysis module changed (affects all components)
              if echo "$CHANGED_FILES" | grep -qE '^analysis/'; then
                echo "build_scraper=true" >> $GITHUB_OUTPUT
                echo "build_dashboard=true" >> $GITHUB_OUTPUT
                echo "build_api=true" >> $GITHUB_OUTPUT
                echo "Analysis module changed - rebuilding all components"
              fi
            fi
          fi
      
      - name: Build and push scraper
        if: steps.changes.outputs.build_scraper == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.scraper
          push: true
          tags: |
            ghcr.io/onelock/stockster-scraper:main-${{ steps.sha.outputs.short }}
            ghcr.io/onelock/stockster-scraper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push dashboard
        if: steps.changes.outputs.build_dashboard == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: true
          tags: |
            ghcr.io/onelock/stockster-dashboard:main-${{ steps.sha.outputs.short }}
            ghcr.io/onelock/stockster-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push API
        if: steps.changes.outputs.build_api == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/onelock/stockster-api:main-${{ steps.sha.outputs.short }}
            ghcr.io/onelock/stockster-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Create namespace if not exists
        run: |
          kubectl create namespace stockster --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Create or update ghcr-secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=stockster \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Create or update postgres-secret
        run: |
          kubectl create secret generic postgres-secret \
            --from-literal=username=stockster \
            --from-literal=password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=database=stockster \
            --from-literal=host=postgres \
            --from-literal=port=5432 \
            --namespace=stockster \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Deploy all resources
        run: |
          kubectl apply -k k8s/
          
          echo "Waiting for PostgreSQL to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres -n stockster --timeout=5m || true
          
          echo "✓ Infrastructure deployed successfully!"
      
      - name: Deploy to staging
        run: |
          IMAGE_TAG="main-${{ steps.sha.outputs.short }}"
          NAMESPACE="stockster"
          
          echo "Deploying version $IMAGE_TAG..."
          
          # Update dashboard (only if changed)
          if [ "${{ steps.changes.outputs.build_dashboard }}" == "true" ]; then
            echo "Updating dashboard..."
            kubectl set image deployment/stockster-dashboard \
              dashboard=ghcr.io/onelock/stockster-dashboard:$IMAGE_TAG \
              -n $NAMESPACE \
              --record
          else
            echo "Skipping dashboard (no changes)"
          fi
          
          # Update API (only if changed)
          if [ "${{ steps.changes.outputs.build_api }}" == "true" ]; then
            echo "Updating API..."
            kubectl set image deployment/stockster-api \
              api=ghcr.io/onelock/stockster-api:$IMAGE_TAG \
              -n $NAMESPACE \
              --record
          else
            echo "Skipping API (no changes)"
          fi
          
          # Update scraper cronjob (only if changed)
          if [ "${{ steps.changes.outputs.build_scraper }}" == "true" ]; then
            echo "Updating scraper..."
            kubectl set image cronjob/stockster-scraper \
              scraper=ghcr.io/onelock/stockster-scraper:$IMAGE_TAG \
              -n $NAMESPACE \
              --record
          else
            echo "Skipping scraper (no changes)"
          fi
          
          echo "Waiting for rollout..."
          if [ "${{ steps.changes.outputs.build_dashboard }}" == "true" ]; then
            kubectl rollout status deployment/stockster-dashboard -n $NAMESPACE --timeout=5m
          fi
          if [ "${{ steps.changes.outputs.build_api }}" == "true" ]; then
            kubectl rollout status deployment/stockster-api -n $NAMESPACE --timeout=5m
          fi
          
          echo "✓ Deployed successfully!"
      
      - name: Create deployment summary
        run: |
          IMAGE_TAG="main-${{ steps.sha.outputs.short }}"
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production (stockster)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built & Published" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.build_scraper }}" == "true" ]; then
            echo "- ✅ \`ghcr.io/onelock/stockster-scraper:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ stockster-scraper (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.changes.outputs.build_dashboard }}" == "true" ]; then
            echo "- ✅ \`ghcr.io/onelock/stockster-dashboard:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ stockster-dashboard (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.changes.outputs.build_api }}" == "true" ]; then
            echo "- ✅ \`ghcr.io/onelock/stockster-api:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ stockster-api (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Resources" >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL Database" >> $GITHUB_STEP_SUMMARY
          echo "- REST API (2 replicas)" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard (2 replicas)" >> $GITHUB_STEP_SUMMARY
          echo "- Scraper CronJob (every 15min)" >> $GITHUB_STEP_SUMMARY