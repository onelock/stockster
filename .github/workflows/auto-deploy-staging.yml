name: Auto Deploy to Staging

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REPO_OWNER_LC: onelock

jobs:
  # STEP 1: Detect what changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      scraper: ${{ steps.filter.outputs.scraper }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'main.py'
              - 'Dockerfile.api'
              - 'requirements.txt'
            scraper:
              - 'scraper/**'
              - 'Dockerfile.scraper'
            dashboard:
              - 'dashboard/**'
              - 'Dockerfile.dashboard'

  # STEP 2: Build only the modified images
  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Conditional API Build
      - name: Build and push API
        if: needs.detect-changes.outputs.api == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-api:main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Conditional Scraper Build
      - name: Build and push Scraper
        if: needs.detect-changes.outputs.scraper == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.scraper
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-scraper:main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Conditional Dashboard Build
      - name: Build and push Dashboard
        if: needs.detect-changes.outputs.dashboard == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-dashboard:main-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STEP 3: Deploy to Kubernetes
  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Kustomize Images
        run: |
          cd k8s
          SHA_TAG="main-$(git rev-parse --short HEAD)"
          # Use Kustomize to set the new images instead of sed
          if [ "${{ needs.detect-changes.outputs.api }}" == "true" ]; then
            kustomize edit set image stockster/api=${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-api:$SHA_TAG
          fi
          if [ "${{ needs.detect-changes.outputs.dashboard }}" == "true" ]; then
            kustomize edit set image stockster/dashboard=${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-dashboard:$SHA_TAG
          fi
          if [ "${{ needs.detect-changes.outputs.scraper }}" == "true" ]; then
            kustomize edit set image stockster/scraper=${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-scraper:$SHA_TAG
          fi

      - name: Apply and Wait
        run: |
          kubectl apply -k k8s/ --namespace=stockster
          kubectl rollout status deployment/stockster-api -n stockster --timeout=3m
          kubectl rollout status deployment/stockster-dashboard -n stockster --timeout=3m