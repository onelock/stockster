# Stockster API Configuration
# Database settings for development and production environments

development:
  database:
    type: postgresql
    host: ${PG_HOST:localhost}
    port: ${PG_PORT:5432}
    database: ${PG_DB:stocksterdb}
    user: ${PG_USER:stockster}
    password: ${PG_PASSWORD:stockster123}
    connect_timeout: 10

production:
  database:
    type: postgresql
    host: ${PG_HOST:postgres-service}
    port: ${PG_PORT:5432}
    database: ${PG_DB:stockster}
    user: ${PG_USER:stockster}
    password: ${PG_PASSWORD}
    connect_timeout: 10

# Default environment (can be overridden by ENVIRONMENT env var)
default_environment: development
