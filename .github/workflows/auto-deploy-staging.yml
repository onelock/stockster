name: Auto Deploy to Staging

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REPO_OWNER_LC: onelock

jobs:
  # STEP 1: Detect what changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      scraper: ${{ steps.filter.outputs.scraper }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'main.py'
              - 'Dockerfile.api'
              - 'requirements.txt'
            scraper:
              - 'scraper/**'
              - 'Dockerfile.scraper'
            dashboard:
              - 'dashboard/**'
              - 'Dockerfile.dashboard'

  # STEP 2: Build and Push modified images
  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: echo "SHA_TAG=main-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push API
        if: ${{ needs.detect-changes.outputs.api == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-api:${{ env.SHA_TAG }}

      - name: Build and Push Dashboard
        if: ${{ needs.detect-changes.outputs.dashboard == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-dashboard:${{ env.SHA_TAG }}

      - name: Build and Push Scraper
        if: ${{ needs.detect-changes.outputs.scraper == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.scraper
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-scraper:${{ env.SHA_TAG }}

  # STEP 3: Update and Deploy
  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Kustomize Images
        run: |
          cd k8s
          SHA_TAG="main-$(git rev-parse --short HEAD)"
          
          # FIXED: These names now match your kustomization.yaml exactly
          if [ "${{ needs.detect-changes.outputs.api }}" == "true" ]; then
            kustomize edit set image stockster/api=${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-api:$SHA_TAG
          fi
          
          if [ "${{ needs.detect-changes.outputs.dashboard }}" == "true" ]; then
            kustomize edit set image stockster/dashboard=${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-dashboard:$SHA_TAG
          fi
          
          if [ "${{ needs.detect-changes.outputs.scraper }}" == "true" ]; then
            kustomize edit set image stockster/scraper=${{ env.REGISTRY }}/${{ env.REPO_OWNER_LC }}/stockster-scraper:$SHA_TAG
          fi

      - name: Apply and Wait
        run: |
          # Apply the kustomization from the k8s directory
          kubectl apply -k k8s/
          
          # Wait for rollout
          kubectl rollout status deployment/stockster-api -n stockster --timeout=300s
          kubectl rollout status deployment/stockster-dashboard -n stockster --timeout=300s