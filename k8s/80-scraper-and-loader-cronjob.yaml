apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockster-scraper-and-loader
spec:
  # Every 15 minutes during market hours (9:00-17:45 CET, Mon-Fri)
  # Runs at: 9:00, 9:15, 9:30, 9:45, ... 17:00, 17:15, 17:30, 17:45
  schedule: "*/15 9-17 * * 1-5"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  
  jobTemplate:
    spec:
      backoffLimit: 2  # Retry twice on failure
      activeDeadlineSeconds: 600  # 10 minute timeout
      
      template:
        metadata:
          labels:
            app: stockster-scraper-loader
        spec:
          restartPolicy: OnFailure
          
          imagePullSecrets:
          - name: ghcr-secret
          
          containers:
          - name: orchestrator
            image: ghcr.io/onelock/stockster-scraper:latest
            imagePullPolicy: IfNotPresent
            
            command: 
            - /bin/bash
            - -c
            - |
              set -e
              
              echo ""
              echo "======================================"
              echo "Step 2: Running scraper..."
              echo "======================================"
              python3 /app/scraper/scrape_di.py
              
              echo ""
              echo "======================================"
              echo "Step 4: Loading CSV to database..."
              echo "======================================"
              python3 /app/loader/load_csv_to_db.py
              
              echo ""
              echo "======================================"
              echo "✅ Pipeline complete!"
              echo "======================================"
            
            envFrom:
            - configMapRef: 
              name: postgres-db-config 
            - secretRef:
                name: postgres-secret
            
            volumeMounts:
            - name: stockster-data
              mountPath: /data
            - name: scraper-code
              mountPath: /app/scraper
            - name: loader-code
              mountPath: /app/loader
            
            resources:
              requests:
                memory: "512Mi"
                cpu: "300m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
          
          volumes:
          - name: stockster-data
            persistentVolumeClaim:
              claimName: stockster-data-pvc
          - name: scraper-code
            configMap:
              name: scraper-code
          - name: loader-code
            configMap:
              name: csv-loader-code
