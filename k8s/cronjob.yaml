apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockster-scraper
spec:
  # Every 15 minutes during market hours (9:00-17:30 CET, Mon-Fri)
  schedule: "*/15 9-17 * * 1-5"
  # timezone: "Europe/Stockholm"  # Requires Kubernetes 1.25+
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600  # 10 minute timeout
      
      template:
        metadata:
          labels:
            app: stockster-scraper
        spec:
          restartPolicy: OnFailure
          
          imagePullSecrets:
          - name: ghcr-secret
          
          containers:
          - name: scraper
            image: stockster/scraper
            imagePullPolicy: Always
            
            command: ["python3", "di_scraper/scrape_di.py"]
            
            env:
            - name: DATABASE_TYPE
              value: "postgresql"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
