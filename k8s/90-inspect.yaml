apiVersion: v1
kind: Pod
metadata:
  name: data-inspector
  namespace: stockster
spec:
  containers:
  - name: inspector
    image: alpine:latest
    command:
    - sleep
    - "3600"
    volumeMounts:
    - name: stockster-data
      mountPath: /data
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
  volumes:
  - name: stockster-data
    persistentVolumeClaim:
      claimName: stockster-data-pvc
  restartPolicy: Never
