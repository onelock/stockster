apiVersion: batch/v1
kind: CronJob
metadata:
  name: csv-loader
  namespace: stockster
spec:
  # Run 5 minutes after scraper: at :05, :20, :35, :50 during market hours
  schedule: "5,20,35,50 9-17 * * 1-5"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run if previous job still running
  
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300  # 5 minutes timeout
      
      template:
        metadata:
          labels:
            app: csv-loader
        spec:
          restartPolicy: OnFailure
          
          containers:
          - name: loader
            image: python:3.11-slim
            
            command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Installing dependencies..."
              pip install --no-cache-dir psycopg2-binary
              echo "Running CSV loader..."
              python3 /app/load_csv_to_db.py
            
            envFrom:
            - configMapRef: 
              name: postgres-db-config 
            - secretRef:
                name: postgres-secret
            
            volumeMounts:
            - name: stockster-data
              mountPath: /data
            - name: loader-code
              mountPath: /app
            
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "500m"
          
          volumes:
          - name: stockster-data
            persistentVolumeClaim:
              claimName: stockster-data-pvc
          - name: loader-code
            configMap:
              name: csv-loader-code
              defaultMode: 0755
