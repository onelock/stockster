apiVersion: batch/v1
kind: Job
metadata:
  name: migration
  namespace: stockster
  labels:
    app: stockster
    component: migration
spec:
  # Don't retry on failure - investigate manually
  backoffLimit: 0
  # Clean up completed jobs after 24 hours
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: stockster
        component: migration
      annotations:
        # Force recreate on each apply
        kubectl.kubernetes.io/restartedAt: "{{ now }}"
    spec:
      restartPolicy: Never
      
      # GitHub Container Registry authentication
      
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Wait for Postgres to be ready
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_HOST
        command:
        - sh
        - -c
        - |
          set -e
          echo "⏳ Waiting for PostgreSQL to be ready..."
          echo "📍 Connecting to: $POSTGRES_HOST:5432"
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          until pg_isready -h "$POSTGRES_HOST" -p 5432 -U "$POSTGRES_USER"; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "❌ PostgreSQL failed to become ready after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Postgres is unavailable - attempt $ATTEMPT/$MAX_ATTEMPTS - sleeping 2s"
            sleep 2
          done
          
          echo "✅ PostgreSQL is ready!"
        securityContext:
          allowPrivilegeEscalation: false

      containers:
      - name: alembic-migrate
        image: ghcr.io/onelock/stockster-api:latest
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          set -e  # Exit on error
          echo "================================================"
          # Use the Python migration runner
          python run_migrations.py
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo ""
            echo "================================================"
            echo "✅ Migration completed successfully!"
            exit 0
          else
            echo ""
            echo "================================================"
            echo "❌ Migration failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
        - name: PG_HOST
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_HOST
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: PG_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: PG_PORT
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_PORT
        - name: DATABASE_URL
          value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/$(PG_DB)
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Alembic needs to write temp files
      
      imagePullSecrets:
      - name: ghcr-secret
