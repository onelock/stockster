apiVersion: batch/v1
kind: CronJob
metadata:
  name: stockster-scraper
spec:
  # Every 15 minutes during market hours (9:00-17:30 CET, Mon-Fri) evn on holidays
  schedule: "*/15 9-17 * * 1-5"
  # timezone: "Europe/Stockholm"  # Requires Kubernetes 1.25+
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600  # 10 minute timeout
      
      template:
        metadata:
          labels:
            app: stockster-scraper
        spec:
          restartPolicy: OnFailure
          
          imagePullSecrets:
          - name: ghcr-secret
          
          containers:
          - name: scraper
            image: stockster/scraper
            imagePullPolicy: Always
            
            command: ["python3", "/app/scrape_di.py"]
            
            env:
            - name: CSV_OUTPUT_DIR
              value: "/data"
            
            volumeMounts:
            - name: stockster-data
              mountPath: /data
            - name: scraper-code
              mountPath: /app
            
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          
          volumes:
          - name: stockster-data
            persistentVolumeClaim:
              claimName: stockster-data-pvc
          - name: scraper-code
            configMap:
              name: scraper-code
