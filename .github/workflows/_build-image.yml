name: Build Docker Image

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (dashboard or api)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      image_name:
        description: 'Image name (e.g., stockster-dashboard)'
        required: true
        type: string
      image_tag:
        description: 'Image tag to use'
        required: true
        type: string
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
    secrets:
      GH_TOKEN:
        required: true

jobs:
  build:
    name: Build ${{ inputs.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          # password: ${{ secrets.GH_TOKEN }
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Output image reference
        run: |
          echo "Built: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
